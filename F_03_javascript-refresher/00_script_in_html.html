<!DOCTYPE html>
<html>
<head>
    <title>Script Basics - Ranhee</title>
</head>
<body>
    <h1>Welcome to My JavaScript Refresher!</h1>
    <p>Learning how JavaScript modules work in the browser.</p>

    <!-- Classic script -->
    <script src="legacy.js"></script>

    <!-- External module script -->
    <script type="module" src="app.js"></script>

    <!-- Inline module script -->
    <script type="module">
        import greet, { userInfo } from "./15_modules_export.js";

        console.log(greet());
        console.log(userInfo);
    </script>
</body>
</html>
